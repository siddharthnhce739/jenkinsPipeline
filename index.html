
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Small Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4ff;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 4px 15px #ccc;
        }

        button {
            background: #4361ee;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #3048bd;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Hello World! 👋</h1>
        <p>Welcome to my first website.</p>
        <button onclick="alert('Welcome! 🎉')">
            Click Me
        </button>
    </div>

</body>
</html>
